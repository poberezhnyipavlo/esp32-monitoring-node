[platformio]
default_envs = esp32dev

[deps]
metric_protocol = https://github.com/poberezhnyipavlo/metric-protocol.git#v2.1.0

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    ${deps.metric_protocol}
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags = -D DHT_SENSOR_TYPE=DHT11

[env:wokwi]
extends = env:esp32dev
build_flags = -D WOKWI_WIFI -D DHT_SENSOR_TYPE=DHT22

[env:native]
platform = native
test_framework = googletest
; -Wno-character-conversion: googletest 1.17 trips Apple clang 21's new char8_t warning in
; gtest-printers.h (C++20 only). -Wno-unknown-warning-option keeps older clang quiet about it.
build_flags = -std=c++20 -pthread -Wall -Wextra -Wconversion -Wshadow -Werror -Wno-unknown-warning-option -Wno-character-conversion
lib_deps =
    google/googletest@1.17.0
    ${deps.metric_protocol}
build_src_filter = -<*> +<../test/>

[env:faults]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D FAULT_INJECTION
monitor_filters =
    ${env:esp32dev.monitor_filters}
    send_on_enter
monitor_echo = yes
