[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    https://github.com/poberezhnyipavlo/metric-protocol.git#v2.0.0
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
build_flags = -D DHT_SENSOR_TYPE=DHT11

[env:wokwi]
extends = env:esp32dev
build_flags = -D WOKWI_WIFI -D DHT_SENSOR_TYPE=DHT22

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17 -pthread -Wall -Wextra -Wconversion -Wshadow -Werror
lib_deps =
    google/googletest@1.17.0
    https://github.com/poberezhnyipavlo/metric-protocol.git#v2.0.0
build_src_filter = -<*> +<../test/>
